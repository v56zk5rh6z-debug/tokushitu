<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>みんなのトークカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
  :root{
    --paper: #FFFFFF;
    --akane: #FF4D6D;
    --akane-deep: #E62E52;
    --lantern: #FFC93C;
    --turquoise: #00C2A8;
    --purple: #7C4DFF;
    --ink: #2B2350;
    --ink-soft: #6E6690;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--purple);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }

  .wrap{
    position:relative; z-index:1;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding: 22px 20px 32px;
  }

  header{ text-align:center; margin-bottom: 14px; width:100%; max-width:380px; }
  header .kicker{
    font-size: 11px; letter-spacing: .18em; color: #FFFFFF;
    margin-bottom: 4px; font-weight:900;
    text-shadow: 0 2px 0 rgba(124,77,255,.35);
  }
  header h1{
    font-family:'Kosugi Maru', sans-serif;
    font-size: 24px; font-weight: 400; margin: 0 0 14px;
    color: #FFFFFF;
    letter-spacing: .04em;
    text-shadow: 0 3px 0 rgba(124,77,255,.4);
  }

  .tabs{
    display:flex; gap:6px; background: rgba(255,255,255,.25);
    border-radius: 100px; padding: 4px;
  }
  .tab{
    flex:1; border:none; background:transparent; color:#fff; font-weight:700;
    font-size:12px; padding:9px 4px; border-radius:100px; font-family:inherit; cursor:pointer;
    opacity:.85;
  }
  .tab.active{ background:#fff; color:var(--purple); opacity:1; }

  .screen{ display:none; width:100%; max-width:380px; flex:1; flex-direction:column; margin-top:16px; }
  .screen.active{ display:flex; }

  /* ---- 共通パーツ ---- */
  .panel{
    background: rgba(255,255,255,.92);
    border-radius: 20px;
    padding: 22px 20px;
    box-shadow: 0 16px 34px rgba(43,35,80,.18);
    color: var(--ink);
  }
  .field-label{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; }
  input[type=text], textarea{
    width:100%; border:2px solid #EDE7FF; border-radius:14px;
    padding: 12px 14px; font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px; color:var(--ink); background:#FBFAFF;
    outline:none;
  }
  input[type=text]:focus, textarea:focus{ border-color: var(--purple); }
  textarea{ resize:none; min-height: 96px; line-height:1.6; }

  .primary-btn{
    width:100%; height:52px; border:none; border-radius:16px; margin-top:16px;
    background: var(--akane);
    color:#fff; font-weight:900; font-size:15px; letter-spacing:.03em;
    box-shadow: 0 10px 22px rgba(124,77,255,.35);
    font-family:inherit; cursor:pointer;
  }
  .primary-btn:active{ transform: scale(.98); }
  .primary-btn:disabled{ opacity:.6; }

  .ghost-btn{
    width:100%; height:44px; border:none; border-radius:14px; margin-top:10px;
    background: rgba(255,255,255,.5); color: var(--ink); font-weight:700; font-size:13px;
    font-family:inherit; cursor:pointer;
  }

  .hint-text{ font-size:12px; color:#fff; opacity:.9; text-align:center; margin-top:12px; line-height:1.7; }

  /* ---- 書く画面 ---- */
  #qrResult{ display:flex; flex-direction:column; align-items:center; margin-top:16px; }
  #qrcodeBox{ background:#fff; padding:24px; border-radius:16px; box-shadow: 0 10px 24px rgba(43,35,80,.15); }
  #qrcodeBox img, #qrcodeBox canvas{ display:block; }
  .qr-caption{ font-size:13px; font-weight:700; color:#fff; margin-top:12px; text-align:center; text-shadow: 0 2px 0 rgba(124,77,255,.3); }

  /* ---- 集める画面 ---- */
  .scan-wrap{ position:relative; width:100%; aspect-ratio: 1/1; border-radius:20px; overflow:hidden; background:#000; box-shadow: 0 16px 34px rgba(43,35,80,.25); }
  #video{ width:100%; height:100%; object-fit:cover; display:none; }
  .scan-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:13px; text-align:center; padding:20px; font-weight:700;
  }
  .scan-frame{
    position:absolute; inset: 15%; border: 3px solid rgba(255,255,255,.7); border-radius: 20px; pointer-events:none;
  }
  .pool-count{ text-align:center; margin: 14px 0 4px; color:#fff; }
  .pool-count .num{ font-family:'Kosugi Maru', sans-serif; font-size: 36px; line-height:1; text-shadow: 0 3px 0 rgba(124,77,255,.4); }
  .pool-count .lbl{ font-size:12px; opacity:.9; margin-top:2px; }

  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color:#fff; padding: 10px 18px; border-radius: 100px;
    font-size: 13px; opacity:0; pointer-events:none; transition: all .25s ease; z-index:50;
    font-weight:700; max-width: 82vw; text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  /* ---- めくる画面(カード) ---- */
  .stage{
    width:100%; flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    perspective: 1400px;
  }
  .counter{ font-size: 13px; color:#fff; margin-bottom: 12px; letter-spacing:.05em; opacity:.9; font-variant-numeric: tabular-nums; }
  .counter b{ color: var(--ink); font-weight:900; background:#fff; padding:1px 8px; border-radius:100px; }

  .card{
    width: 100%; aspect-ratio: 3/4.1; max-height: 50vh; position: relative;
    transform-style: preserve-3d; transition: transform .62s cubic-bezier(.22,.9,.32,1.1); cursor: pointer;
  }
  .card.flipping{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0; border-radius: 18px; backface-visibility: hidden;
    display:flex; flex-direction:column;
    box-shadow: 0 18px 40px rgba(0,0,0,.25), 0 2px 0 rgba(255,255,255,.04) inset;
  }
  .front{
    background: var(--paper); color: var(--ink); padding: 26px 24px 24px; justify-content:space-between;
    border: 1px solid rgba(43,33,24,.08);
  }
  .tag{
    align-self:flex-start; font-size: 11px; font-weight: 900; letter-spacing:.06em;
    padding: 5px 12px; border-radius: 100px; color: #fff; background: var(--akane);
  }
  .qwrap{ flex:1; display:flex; align-items:center; }
  .question{ font-family:'Kosugi Maru', sans-serif; font-size: 21px; line-height: 1.6; font-weight: 400; color: var(--ink); }
  .empty-question{ font-size:15px; color: var(--ink-soft); line-height:1.7; }
  .front-foot{ display:flex; align-items:center; justify-content:space-between; border-top: 1px solid rgba(43,33,24,.12); padding-top: 14px; }
  .front-foot .hint{ font-size:11px; color: var(--ink-soft); }
  .stamp{
    width: 40px; height:40px; border-radius: 50%; border: 3px solid var(--akane);
    display:flex; align-items:center; justify-content:center; color: var(--akane);
    font-family:'Kosugi Maru', sans-serif; font-size: 14px; transform: rotate(-8deg); opacity:.9;
  }
  .back{
    transform: rotateY(180deg);
    background: var(--turquoise);
    border: 1px solid rgba(255,255,255,.3); align-items:center; justify-content:center;
  }
  .back .mon{
    width: 80px; height: 80px; border-radius:50%;
    background: var(--lantern);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 6px rgba(255,255,255,.25), 0 0 40px rgba(255,255,255,.35);
  }
  .back .mon span{
    width: 62px; height:62px; border-radius:50%; background: #FFFDF6;
    display:flex; align-items:center; justify-content:center; color: var(--akane);
    font-family:'Kosugi Maru', sans-serif; font-size: 20px; font-weight:400;
  }

  .controls{ width:100%; display:flex; gap: 10px; margin-top: 14px; }
  button{ font-family: inherit; }
  .btn-icon{
    flex: 0 0 48px; height: 48px; border-radius: 14px; background:#fff; border:none;
    color: var(--purple); display:flex; align-items:center; justify-content:center;
    font-size: 19px; font-weight:900; box-shadow: 0 8px 18px rgba(43,35,80,.18); cursor:pointer;
  }
  .btn-icon:active{ transform: scale(.92); }
  .controls .primary-btn{ margin-top:0; }
</style>
</head>
<body>

<div class="stars"></div>

<div class="wrap">
  <header>
    <div class="kicker">TALK CARD · QRでみんなの質問</div>
    <h1>みんなのトークカード</h1>
    <div class="tabs">
      <button class="tab active" data-tab="write">① 書く</button>
      <button class="tab" data-tab="scan">② 集める</button>
      <button class="tab" data-tab="reveal">③ めくる</button>
    </div>
  </header>

  <!-- ① 書く画面(全員がここで質問を書いてQR化) -->
  <div class="screen active" id="screen-write">
    <div class="panel">
      <div class="field-label">質問をひとつ書こう(誰が書いたかは表示されません)</div>
      <textarea id="questionInput" maxlength="70" placeholder="例：最近ちょっと頑張ったことは？"></textarea>
      <button class="primary-btn" id="makeQrBtn">QRコードを作る</button>
    </div>
    <div id="qrResult" style="display:none;">
      <div id="qrcodeBox"></div>
      <div class="qr-caption">この画面を、集める人のカメラに見せてね</div>
      <button class="ghost-btn" id="anotherQBtn">別の質問も書く</button>
    </div>
    <p class="hint-text">自分のスマホの画面だけで完結するので、予測変換や他の内容が見られる心配はありません。</p>
  </div>

  <!-- ② 集める画面(誰か1人のスマホでカメラ読み取り) -->
  <div class="screen" id="screen-scan">
    <div class="scan-wrap">
      <video id="video" playsinline muted></video>
      <div class="scan-overlay" id="scanOverlay">カメラでみんなのQRコードを<br>順番に読み取ってね</div>
      <div class="scan-frame" id="scanFrame" style="display:none;"></div>
    </div>
    <button class="primary-btn" id="camBtn">カメラを起動する</button>
    <div class="pool-count">
      <div class="num" id="poolCount">0</div>
      <div class="lbl">問、集まりました</div>
    </div>
    <p class="hint-text">読み取ったQRの中身はこの端末にだけ保存されます。<br>集まったら「③ めくる」へ。</p>
  </div>

  <!-- ③ めくる画面 -->
  <div class="screen" id="screen-reveal">
    <div class="stage">
      <div class="counter"><b id="cur">0</b> / <span id="total">0</span> 枚目</div>
      <div class="card" id="card">
        <div class="face front">
          <span class="tag">匿名の質問</span>
          <div class="qwrap"><div class="question" id="question">まだ質問がありません</div></div>
          <div class="front-foot">
            <span class="hint">タップでめくる</span>
            <span class="stamp">問</span>
          </div>
        </div>
        <div class="face back"><div class="mon"><span>宴</span></div></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn-icon" id="shuffleBtn" aria-label="シャッフルし直す">⟲</button>
      <button class="primary-btn" id="nextBtn">次のカードをめくる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- 共通 ----------
  let deck = [];       // 集まった質問(文字列配列、この端末のメモリ内のみ)
  let order = [];
  let pos = 0;
  let showingFront = true;

  const toastEl = document.getElementById('toast');
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---------- タブ切り替え ----------
  const tabs = document.querySelectorAll('.tab');
  const screens = {
    write: document.getElementById('screen-write'),
    scan: document.getElementById('screen-scan'),
    reveal: document.getElementById('screen-reveal'),
  };
  function switchTab(name){
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    Object.entries(screens).forEach(([k, el]) => el.classList.toggle('active', k === name));
    if(name === 'reveal'){
      order = shuffle([...Array(deck.length).keys()]);
      pos = 0; showingFront = true;
      cardEl.classList.remove('flipping');
      setCardContent(0);
    }
    if(name !== 'scan'){ stopCamera(); }
  }
  tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  // ---------- ① 書く / QR生成 ----------
  let qrObj = null;

  document.getElementById('makeQrBtn').addEventListener('click', () => {
    const original = document.getElementById('questionInput').value.trim();
    if(!original){
      showToast('質問を入力してね');
      return;
    }

    // 日本語をそのままQRへ渡さず、ASCIIのURLエンコード文字列にする
    const payload = 'TALKCARD_V3|' + encodeURIComponent(original);
    const box = document.getElementById('qrcodeBox');

    box.innerHTML = '';
    qrObj = new QRCode(box, {
      text: payload,
      width: 300,
      height: 300,
      correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById('qrResult').style.display = 'flex';
  });
  document.getElementById('anotherQBtn').addEventListener('click', () => {
    document.getElementById('questionInput').value = '';
    document.getElementById('qrResult').style.display = 'none';
    document.getElementById('questionInput').focus();
  });

  // ---------- ② 集める / QRスキャン ----------
  const video = document.getElementById('video');
  const overlay = document.getElementById('scanOverlay');
  const frame = document.getElementById('scanFrame');
  const camBtn = document.getElementById('camBtn');
  const poolCountEl = document.getElementById('poolCount');

  let stream = null;
  let scanning = false;
  let lastCode = '';
  let lastCodeTime = 0;
  let scanBusy = false;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});

  async function setContinuousFocus(track){
    try{
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if(caps.focusMode && caps.focusMode.includes('continuous')){
        await track.applyConstraints({
          advanced: [{focusMode:'continuous'}]
        });
      }
    }catch(e){}
  }

  async function startCamera(){
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error('Camera API unavailable');
      }

      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{ideal:'environment'},
          width:{ideal:1920},
          height:{ideal:1080}
        }
      });

      video.srcObject = stream;
      video.setAttribute('playsinline','true');
      video.muted = true;
      video.style.display = 'block';
      overlay.style.display = 'none';
      frame.style.display = 'block';

      await setContinuousFocus(stream.getVideoTracks()[0]);
      await video.play();

      scanning = true;
      camBtn.textContent = 'カメラを止める';
      requestAnimationFrame(scanLoop);
    }catch(e){
      console.error(e);
      showToast('カメラを起動できませんでした。設定でカメラ許可を確認してね');
    }
  }

  function stopCamera(){
    scanning = false;

    if(stream){
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
    video.style.display = 'none';
    overlay.style.display = 'flex';
    frame.style.display = 'none';
    camBtn.textContent = 'カメラを起動する';
  }

  function decodeTalkCard(data){
    if(!data) return null;

    if(data.startsWith('TALKCARD_V3|')){
      try{
        return decodeURIComponent(data.slice('TALKCARD_V3|'.length));
      }catch(e){
        return null;
      }
    }

    // 旧形式
    if(data.startsWith('TALKCARD:')){
      try{
        return decodeURIComponent(data.slice('TALKCARD:'.length));
      }catch(e){
        return null;
      }
    }

    return data;
  }

  function addScannedQuestion(data){
    const text = decodeTalkCard(data);
    if(!text) return;

    const now = Date.now();
    if(text === lastCode && now - lastCodeTime < 2500) return;

    lastCode = text;
    lastCodeTime = now;

    if(!deck.includes(text)){
      deck.push(text);
      poolCountEl.textContent = deck.length;
      showToast('質問を追加しました！');
      if(navigator.vibrate) navigator.vibrate(60);
    }
  }

  function scanLoop(){
    if(!scanning) return;

    if(!scanBusy &&
       video.readyState >= video.HAVE_CURRENT_DATA &&
       video.videoWidth > 0 &&
       video.videoHeight > 0){

      scanBusy = true;

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      // 画面全体を適度なサイズに縮小して解析
      const scale = Math.min(1, 1400 / Math.max(vw,vh));
      const w = Math.max(1, Math.round(vw * scale));
      const h = Math.max(1, Math.round(vh * scale));

      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(video,0,0,w,h);

      let imageData = ctx.getImageData(0,0,w,h);
      let code = jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {inversionAttempts:'attemptBoth'}
      );

      // 全体で見つからない場合は中央を拡大して再解析
      if(!code){
        const sx = Math.round(vw * 0.125);
        const sy = Math.round(vh * 0.125);
        const sw = Math.round(vw * 0.75);
        const sh = Math.round(vh * 0.75);

        canvas.width = sw;
        canvas.height = sh;
        ctx.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);

        imageData = ctx.getImageData(0,0,sw,sh);
        code = jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {inversionAttempts:'attemptBoth'}
        );
      }

      if(code && code.data){
        addScannedQuestion(code.data);
      }

      scanBusy = false;
    }

    requestAnimationFrame(scanLoop);
  }
// ---------- ③ めくる ----------
  const cardEl = document.getElementById('card');
  const qEl = document.getElementById('question');
  const curEl = document.getElementById('cur');
  const totalEl = document.getElementById('total');

  function setCardContent(index){
    if(order.length === 0){
      qEl.textContent = 'まだ質問がありません。「② 集める」でQRを読み取ってね';
      qEl.classList.add('empty-question');
      curEl.textContent = 0;
      totalEl.textContent = 0;
      return;
    }
    qEl.classList.remove('empty-question');
    qEl.textContent = deck[order[index]];
    curEl.textContent = index + 1;
    totalEl.textContent = order.length;
  }

  function drawNext(){
    if(order.length === 0){ showToast('質問がまだありません'); return; }
    if(showingFront){
      cardEl.classList.add('flipping');
      showingFront = false;
      setTimeout(() => {
        pos = (pos + 1) % order.length;
        if(pos === 0) shuffle(order);
        setCardContent(pos);
      }, 310);
    } else {
      cardEl.classList.remove('flipping');
      showingFront = true;
    }
  }

  document.getElementById('shuffleBtn').addEventListener('click', () => {
    order = shuffle([...Array(deck.length).keys()]);
    pos = 0; showingFront = true;
    cardEl.classList.remove('flipping');
    setCardContent(0);
    showToast('シャッフルしました');
  });
  document.getElementById('nextBtn').addEventListener('click', drawNext);
  camBtn.addEventListener('click', () => {
    if(scanning) stopCamera();
    else startCamera();
  });
  cardEl.addEventListener('click', drawNext);</script>

</body>
</html>
